<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SettleUp — Debt Simplification</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="wrap">

  <header class="head">
    <div class="head-top">
      <h1>SettleUp</h1>
      <button id="resetBtn" class="ghost-btn" title="Start a new trip">reset</button>
    </div>
    <p class="sub">Minimum-transaction debt simplification for shared expenses.</p>
  </header>

  <section class="panel">
    <div class="panel-label">01 — People</div>
    <div id="peopleList" class="chips"></div>
    <form id="personForm" class="inline-form">
      <input type="text" id="personName" placeholder="Add a name" autocomplete="off" maxlength="24">
      <button type="submit">Add</button>
    </form>
  </section>

  <section class="panel">
    <div class="panel-label">02 — Expenses</div>
    <div id="expenseList" class="expense-list"></div>

    <form id="expenseForm" class="expense-form">
      <div class="field-row">
        <input type="text" id="expDesc" placeholder="What was it for?" autocomplete="off" maxlength="40">
        <input type="number" id="expAmount" placeholder="Amount" step="0.01" min="0.01">
      </div>
      <div class="field-row">
        <div class="field-group">
          <label class="field-label">Paid by</label>
          <select id="expPayer"></select>
        </div>
        <div class="field-group">
          <label class="field-label">Split between</label>
          <div id="expParticipants" class="participant-select"></div>
        </div>
      </div>
      <button type="submit" class="primary-btn">Add expense</button>
    </form>
  </section>

  <section class="panel">
    <div class="panel-label">03 — Ledger</div>
    <div id="balanceLedger" class="ledger"></div>
  </section>

  <section class="panel">
    <div class="panel-label">04 — Settlement</div>
    <div id="settlementSummary" class="settlement-summary"></div>
    <div id="settlementList" class="settlement-list"></div>
  </section>

  <footer class="foot">
    <span>Balances net to zero · Settlement minimizes total transactions</span>
  </footer>

</div>

<script>
  window.__INITIAL_PEOPLE__ = {{ trip.people | tojson }};
  window.__INITIAL_EXPENSES__ = {{ trip.expenses | tojson }};
</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
